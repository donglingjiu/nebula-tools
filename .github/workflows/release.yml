name: Release Portable
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（如 v1.0.0）'
        required: true
        default: 'v1.0.0'
      full:
        description: '同时组装 full 包（随包 MySQL/Python）'
        type: boolean
        default: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: linux,   goarch: amd64, ext: '' }
          - { goos: darwin,  goarch: arm64, ext: '' }
          - { goos: darwin,  goarch: amd64, ext: '' }
          - { goos: windows, goarch: amd64, ext: '.exe' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.22' }

      - name: 写入版本标识（scripts/components.env → buildinfo）
        run: |
          source scripts/components.env
          VER="${{ github.event.inputs.version || github.ref_name }}"
          GOV="$(go version | awk '{print $3}' | sed 's/go//')"
          printf '{"version":"%s","go":"%s","node_build":"none","bundled":{"mysql":"%s","python":"%s","redis":"none"},"build_at":"%s"}\n' \
            "$VER" "$GOV" "$MYSQL_VERSION" "$PYTHON_VERSION" "$(date -u +%FT%TZ)" \
            > internal/buildinfo/runtime.json
          cat internal/buildinfo/runtime.json

      - name: 交叉编译
        run: |
          go mod tidy
          mkdir -p release/bin
          CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
            go build -trimpath -ldflags "-s -w" \
            -o "release/bin/nebula-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}" ./cmd/server

      - name: 组装 core + full 包
        env:
          FULL: ${{ github.event.inputs.full != 'false' }}
        run: |
          bash scripts/assemble.sh ${{ matrix.goos }} ${{ matrix.goarch }} \
            '${{ matrix.ext }}' '${{ github.event.inputs.version || github.ref_name }}'

      - uses: actions/upload-artifact@v4
        with:
          name: nebula-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            release/*.zip
            release/*.tar.gz
          retention-days: 30
