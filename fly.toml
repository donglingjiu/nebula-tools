app = "nebula-tools"
primary_region = "hkg"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  NEBULA_DATA_DIR = "/data"

[mounts]
  source = "nebula_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  [[http_service.checks]]
    path = "/api/health"
    interval = "30s"
    timeout = "3s"
