<script>
var PDFDOC=PDFLib.PDFDocument,FONT=PDFLib.StandardFonts,DEG=PDFLib.degrees,RGB=PDFLib.rgb;
function setStatus(m,e){var s=document.querySelector('#app .out');if(s){s.textContent=m;s.className=e?'out err':'out'}}
function sz(n){return n>1048576?(n/1048576).toFixed(2)+' MB':(n/1024).toFixed(1)+' KB'}
async function loadPDF(f){var buf=await f.arrayBuffer();
  try{return await PDFDOC.load(buf)}catch(e){throw new Error(String(e).indexOf('ncrypt')>=0?'PDF 已加密,请先解密再处理':'PDF 解析失败:'+e.message)}}
function safeName(s){return String(s).replace(/[^\w\u4e00-\u9fa5.-]+/g,'-').slice(0,60)||'pdf'}
async function dl(bytes,name){window.novaDL(new Blob([bytes],{type:'application/pdf'}),name);
  return sz(bytes.length!==undefined?bytes.length:bytes.byteLength)}
function parseRange(str,total){var set=[],parts=String(str).split(','),i;
  for(i=0;i<parts.length;i++){var p=parts[i].trim();if(!p)continue;
    var m=p.match(/^(\d+)(?:-(\d*))?$/);if(!m)throw new Error('无法识别「'+p+'」,示例:1-3,5,8-');
    var a=+m[1],b=(m[2]===undefined)?a:(m[2]===''?total:+m[2]);
    if(a<1||b<1||a>total||b>total)throw new Error('页码超出范围(共 '+total+' 页):'+p);
    if(a>b){var t2=a;a=b;b=t2}
    for(var k=a;k<=b;k++)set.push(k-1)}
  if(!set.length)throw new Error('请填写页码范围');
  return Array.from(new Set(set)).sort(function(x,y){return x-y})}
var TOOLS={
split:{t:'拆分 / 提取',d:'按页码范围提取为新 PDF,或每页拆成单独文件打包 ZIP',r:function(el){
  el.innerHTML='<label class="drop"><div class="big">点击选择 PDF 文件</div><div class="hint" id="info">未选择文件</div><input type="file" id="f" accept=".pdf"></label><div class="row"><input id="range" placeholder="页码范围,如 1-3,5,8-" style="flex:1"><label class="ck"><input type="checkbox" id="each"> 每页单独文件(ZIP)</label><button class="btn" id="go">执行</button></div><pre class="out">选择 PDF 并填写页码范围;「8-」表示从第 8 页到末页</pre>';
  var pdf=null,total=0,name='pdf';
  el.querySelector('#f').onchange=async function(){var f=this.files[0];if(!f)return;name=f.name.replace(/\.pdf$/i,'');
    try{pdf=await loadPDF(f);total=pdf.getPageCount();el.querySelector('#info').textContent=name+'.pdf · '+total+' 页 · '+sz(f.size)}catch(e){pdf=null;setStatus(e.message,true)}};
  el.querySelector('#go').onclick=async function(){
    if(!pdf){setStatus('请先选择 PDF',true);return}
    try{var idx=parseRange(el.querySelector('#range').value,total);
      if(el.querySelector('#each').checked){
        var zip=new JSZip(),i;
        for(i=0;i<idx.length;i++){var nd=await PDFDOC.create();var cp=await nd.copyPages(pdf,[idx[i]]);nd.addPage(cp[0]);
          zip.file(name+'-第'+(idx[i]+1)+'页.pdf',await nd.save())}
        var blob=await zip.generateAsync({type:'blob'});
        var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name+'-拆分.zip';a.click();
        setStatus('完成 ✓ '+idx.length+' 个 PDF 已打包,共 '+sz(blob.size));
      }else{
        var nd=await PDFDOC.create();var cps=await nd.copyPages(pdf,idx);cps.forEach(function(p){nd.addPage(p)});
        var size=await dl(await nd.save(),name+'-提取.pdf');
        setStatus('完成 ✓ 提取 '+idx.length+'/'+total+' 页,输出 '+size);
      }}catch(e){setStatus(e.message,true)}};
}},
merge:{t:'合并 PDF',d:'多个 PDF 按选择顺序合并为一个',r:function(el){
  el.innerHTML='<label class="drop"><div class="big">点击选择多个 PDF(可多选)</div><div class="hint">按列表顺序合并</div><input type="file" id="f" accept=".pdf" multiple></label><div class="row"><button class="btn" id="go">合并</button></div><pre class="out">选择文件后合并</pre>';
  var files=[];
  el.querySelector('#f').onchange=function(){files=Array.prototype.slice.call(this.files);
    el.querySelector('.out').textContent=files.length?files.map(function(f,i){return (i+1)+'. '+f.name+' · '+sz(f.size)}).join('\n'):'选择文件后合并'};
  el.querySelector('#go').onclick=async function(){
    if(files.length<2){setStatus('请至少选择 2 个 PDF',true);return}
    try{var out=await PDFDOC.create(),pages=0,i;
      for(i=0;i<files.length;i++){var src=await loadPDF(files[i]);var cps=await out.copyPages(src,src.getPageIndices());cps.forEach(function(p){out.addPage(p)});pages+=cps.length}
      var size=await dl(await out.save(),'合并.pdf');
      setStatus('完成 ✓ '+files.length+' 个文件合并为 '+pages+' 页,输出 '+size);
    }catch(e){setStatus(e.message,true)}};
}},
watermark:{t:'加水印',d:'全页斜向文字水印,支持九宫格平铺',r:function(el){
  el.innerHTML='<label class="drop"><div class="big">点击选择 PDF 文件</div><div class="hint" id="info">未选择文件</div><input type="file" id="f" accept=".pdf"></label><div class="row"><input id="txt" placeholder="水印文字(英文/数字,如 CONFIDENTIAL)" style="flex:1"><input id="psize" type="number" value="48" style="width:90px" title="字号"><label class="ck"><input type="checkbox" id="tile"> 平铺</label><button class="btn" id="go">执行</button></div><pre class="out">内置字体暂不支持中文水印(需嵌入 CJK 字体),请用英文/数字</pre>';
  var pdf=null,name='pdf';
  el.querySelector('#f').onchange=async function(){var f=this.files[0];if(!f)return;name=f.name.replace(/\.pdf$/i,'');
    try{pdf=await loadPDF(f);el.querySelector('#info').textContent=name+'.pdf · '+pdf.getPageCount()+' 页 · '+sz(f.size)}catch(e){pdf=null;setStatus(e.message,true)}};
  el.querySelector('#go').onclick=async function(){
    if(!pdf){setStatus('请先选择 PDF',true);return}
    var txt=el.querySelector('#txt').value.trim();
    if(!txt){setStatus('请输入水印文字',true);return}
    if(/[^\u0000-\u00ff]/.test(txt)){setStatus('内置字体暂不支持中文水印,请改用英文/数字',true);return}
    try{var font=await pdf.embedFont(FONT.HelveticaBold),psize=+el.querySelector('#psize').value||48,
        tile=el.querySelector('#tile').checked,tw=font.widthOfTextAtSize(txt,psize),pgs=pdf.getPages(),i;
      for(i=0;i<pgs.length;i++){var w=pgs[i].getWidth(),h=pgs[i].getHeight();
        if(tile){var xs=[0.25,0.55,0.8],ys=[0.25,0.5,0.75],x,y;
          for(x of xs)for(y of ys)pgs[i].drawText(txt,{x:w*x-tw/2,y:h*y,size:psize,font,color:RGB(0.55,0.55,0.6),opacity:0.15,rotate:DEG(35)});
        }else pgs[i].drawText(txt,{x:w/2-tw/2,y:h/2-psize,size:psize,font,color:RGB(0.55,0.55,0.6),opacity:0.15,rotate:DEG(35)});}
      var size=await dl(await pdf.save(),name+'-水印.pdf');
      setStatus('完成 ✓ '+pgs.length+' 页已加水印,输出 '+size);
    }catch(e){setStatus(e.message,true)}};
}},
pagenum:{t:'加页码',d:'底部页码 X / N,居中或居右',r:function(el){
  el.innerHTML='<label class="drop"><div class="big">点击选择 PDF 文件</div><div class="hint" id="info">未选择文件</div><input type="file" id="f" accept=".pdf"></label><div class="row"><select id="fmt"><option>X / N</option><option>- X -</option><option>Page X of N</option></select><select id="pos"><option value="c">底部居中</option><option value="r">底部右侧</option></select><button class="btn" id="go">执行</button></div><pre class="out">选择 PDF 后执行</pre>';
  var pdf=null,name='pdf';
  el.querySelector('#f').onchange=async function(){var f=this.files[0];if(!f)return;name=f.name.replace(/\.pdf$/i,'');
    try{pdf=await loadPDF(f);el.querySelector('#info').textContent=name+'.pdf · '+pdf.getPageCount()+' 页 · '+sz(f.size)}catch(e){pdf=null;setStatus(e.message,true)}};
  el.querySelector('#go').onclick=async function(){
    if(!pdf){setStatus('请先选择 PDF',true);return}
    try{var font=await pdf.embedFont(FONT.Helvetica),pgs=pdf.getPages(),total=pgs.length,
        fmt=el.querySelector('#fmt').value,pos=el.querySelector('#pos').value,i;
      for(i=0;i<total;i++){var lab=fmt.replace('X',i+1).replace('N',total),lw=font.widthOfTextAtSize(lab,10),w=pgs[i].getWidth();
        pgs[i].drawText(lab,{x:pos==='c'?(w-lw)/2:w-lw-36,y:22,size:10,font,color:RGB(0.35,0.38,0.45)})}
      var size=await dl(await pdf.save(),name+'-页码.pdf');
      setStatus('完成 ✓ '+total+' 页已加页码,输出 '+size);
    }catch(e){setStatus(e.message,true)}};
}},
rotate:{t:'旋转页面',d:'全部页面统一旋转 90/180/270 度',r:function(el){
  el.innerHTML='<label class="drop"><div class="big">点击选择 PDF 文件</div><div class="hint" id="info">未选择文件</div><input type="file" id="f" accept=".pdf"></label><div class="row"><select id="ang"><option value="90">顺时针 90°</option><option value="180">180°</option><option value="270">逆时针 90°</option></select><button class="btn" id="go">执行</button></div><pre class="out">选择 PDF 后执行</pre>';
  var pdf=null,name='pdf';
  el.querySelector('#f').onchange=async function(){var f=this.files[0];if(!f)return;name=f.name.replace(/\.pdf$/i,'');
    try{pdf=await loadPDF(f);el.querySelector('#info').textContent=name+'.pdf · '+pdf.getPageCount()+' 页 · '+sz(f.size)}catch(e){pdf=null;setStatus(e.message,true)}};
  el.querySelector('#go').onclick=async function(){
    if(!pdf){setStatus('请先选择 PDF',true);return}
    try{var add=+el.querySelector('#ang').value,pgs=pdf.getPages(),i;
      for(i=0;i<pgs.length;i++)pgs[i].setRotation(DEG((pgs[i].getRotation().angle+add)%360));
      var size=await dl(await pdf.save(),name+'-旋转.pdf');
      setStatus('完成 ✓ '+pgs.length+' 页已旋转 '+add+'°,输出 '+size);
    }catch(e){setStatus(e.message,true)}};
}},
optimize:{t:'优化瘦身',d:'对象流重组另存,减小文件体积',r:function(el){
  el.innerHTML='<label class="drop"><div class="big">点击选择 PDF 文件</div><div class="hint" id="info">未选择文件</div><input type="file" id="f" accept=".pdf"></label><div class="row"><button class="btn" id="go">优化并下载</button></div><pre class="out">重建对象流后另存;图片为主的 PDF 收益有限</pre>';
  var pdf=null,f0=null,name='pdf';
  el.querySelector('#f').onchange=async function(){f0=this.files[0];if(!f0)return;name=f0.name.replace(/\.pdf$/i,'');
    try{pdf=await loadPDF(f0);el.querySelector('#info').textContent=name+'.pdf · '+pdf.getPageCount()+' 页 · '+sz(f0.size)}catch(e){pdf=null;setStatus(e.message,true)}};
  el.querySelector('#go').onclick=async function(){
    if(!pdf){setStatus('请先选择 PDF',true);return}
    try{var out=await pdf.save({useObjectStreams:true}),after=out.length,pct=((1-after/f0.size)*100).toFixed(1);
      var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([out],{type:'application/pdf'}));a.download=name+'-优化.pdf';a.click();
      setStatus('完成 ✓ '+sz(f0.size)+' → '+sz(after)+(pct>0?'(省 '+pct+'%)':'(原文件已足够精简)'));
    }catch(e){setStatus(e.message,true)}};
}}
};
var id=(location.hash||'').slice(1);
if(!TOOLS[id])id='split';
var t=TOOLS[id];
document.title=t.t+' · Nova 工具';
document.getElementById('tt').textContent='PDF 工具箱 · '+t.t;
document.getElementById('dd').textContent=t.d;
t.r(document.getElementById('app'));
var h='',k;
for(k in TOOLS)h+='<a class="nv'+(k===id?' on':'')+'" href="#'+k+'">'+TOOLS[k].t+'</a>';
document.getElementById('nav').innerHTML=h;
window.addEventListener('hashchange',function(){location.reload()});
</script>
