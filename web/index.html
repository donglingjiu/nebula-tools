<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nova Tools · AI 驱动的工具与工作空间</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✦</text></svg>">
<link rel="stylesheet" href="/assets/styles.css">
<link rel="stylesheet" href="/assets/experiences.css">
<style>
/* nova-app additions：工具输出/图表等设计系统未覆盖的类 */
.out{background:#fff;border:1px solid #dce5f3;border-radius:14px;padding:14px;min-height:220px;white-space:pre-wrap;word-break:break-word;font:12.5px ui-monospace,Menlo,monospace;color:#536382;overflow:auto;max-height:60vh}
.out img{max-width:100%;border-radius:10px}
.md h1,.md h2{margin:14px 0 8px}.md p{margin:8px 0}.md code{background:#f0f4fb;padding:2px 6px;border-radius:6px;font-size:12px}.md pre{background:#f0f4fb;padding:12px;border-radius:10px;overflow:auto}.md a{color:#4e6de0}
.bar-row{display:flex;align-items:center;gap:10px;margin:9px 0}
.bar-row .lb{width:150px;font-size:11px;color:#71809e;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-row .bar{flex:1;height:16px;background:#eef2fa;border-radius:99px;overflow:hidden}
.bar-row .bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#5c80f2,#9a7bf0)}
.bar-row .v{width:44px;font-size:11px;color:#71809e}
.msg.err .bubble{border-color:#f4d9d6!important;background:#fff5f4!important;color:#c05f5f!important}
</style>
</head>
<body data-page="home">
<div id="app"></div>
<script src="/assets/app.js"></script>
</body>
