  <h1>文本转脑图</h1>
  <p class="sub">左侧输入 Markdown 大纲(# 一级 / ## 二级 / ### 三级)，右侧实时生成可交互脑图，可缩放、折叠展开。全程本地渲染，内容不上传。</p>
  <div class="btnrow">
    <button class="btn2" id="fit">适应画布</button>
    <button class="btn" id="dl">导出 SVG</button>
    <span class="hint">导出的 SVG 含交互节点，用浏览器打开效果最佳</span>
  </div>
  <div class="status" id="status"></div>
  <div class="split">
    <textarea id="src" spellcheck="false"># Nova 工具站
## 已上线
### Word 转 PDF
### Excel 分析整理
### 文本转脑图
### 文本转流程图
## 规划中
### PDF 全家桶
### 真 AI 接入</textarea>
    <div class="mmwrap"><svg id="mm"></svg></div>
  </div>
</div>
<script>
function $(id){return document.getElementById(id)}
function setStatus(m,e){var s=$('status');s.textContent=m;s.className=e?'status err':'status'}
var mm=null,tr=null;
try{tr=new markmap.Transformer()}catch(e){setStatus('markmap 库加载失败，检查 vendor 文件',true);throw e}
function render(){
  try{
    var res=tr.transform($('src').value);
    if(!mm){
      mm=markmap.Markmap.create($('mm'),{duration:200},res.root);
      setTimeout(function(){mm.fit()},300);
    }else{mm.setData(res.root)}
    setStatus('渲染成功 ✓');
  }catch(e){setStatus('解析失败:'+e.message,true)}
}
var t=null;
$('src').addEventListener('input',function(){clearTimeout(t);t=setTimeout(render,400)});
$('fit').addEventListener('click',function(){if(mm)mm.fit()});
$('dl').addEventListener('click',function(){
  if(!mm)return;
  var s=new XMLSerializer().serializeToString($('mm'));
  window.novaDL(new Blob([s],{type:'image/svg+xml;charset=utf-8'}),'脑图.svg');
});
render();
</script>
