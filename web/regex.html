<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,"PingFang SC",Consolas,monospace;background:#f5f7fb;min-height:100vh;display:flex;justify-content:center;padding:40px 20px}
.wrap{width:100%;max-width:860px}
.back{display:inline-block;margin-bottom:18px;color:#4f6ef7;text-decoration:none;font-size:14px}
h1{font-size:26px;color:#1a2233}
.sub{color:#7a8499;margin:8px 0 18px;font-size:14px}
label{font-size:13px;color:#445}
.pat{width:100%;border:1px solid #d5dcf0;border-radius:10px;padding:10px 14px;font:14px Consolas,monospace}
textarea{width:100%;height:180px;border:1px solid #d5dcf0;border-radius:12px;padding:12px;font:13px/1.6 Consolas,monospace;margin-top:6px}
.flags{display:flex;gap:14px;margin:10px 0;align-items:center;flex-wrap:wrap}
.hl{border:1px solid #d5dcf0;border-radius:12px;background:#fff;padding:12px;font:13px/1.7 Consolas,monospace;margin-top:10px;min-height:44px;white-space:pre-wrap;word-break:break-all}
mark{background:#ffe58f;border-radius:3px;padding:0 1px}

.list li{margin:4px 0 4px 18px}

.rep{margin-top:12px;display:flex;gap:10px;align-items:center}

<div class="wrap">
  <a class="back" href="tools.html">← 返回工具大全</a>
  <h1>正则测试器</h1>
  <p class="sub">实时高亮 · 匹配列表与分组 · 替换预览,全程本地。</p>
  <label>正则表达式</label>
  <input class="pat" id="pat" placeholder="\d+">
  <div class="flags">
    <label><input type="checkbox" id="fg" checked> g 全局</label>
    <label><input type="checkbox" id="fi"> i 忽略大小写</label>
    <label><input type="checkbox" id="fm"> m 多行</label>
    <label><input type="checkbox" id="fs"> s 点匹配换行</label>
    <label><input type="checkbox" id="fu"> u Unicode</label>
  </div>
  <label>测试文本</label>
  <textarea id="txt" placeholder="粘贴文本,如:发票号25337000000572298690 金额438.00">发票号25337000000572298690 金额438.00 税额24.79</textarea>
  <div class="err" id="err"></div>
  <div class="hl" id="hl"></div>
  <ul class="list" id="list"></ul>
  <div class="rep">
    <label>替换为</label>
    <input class="pat" id="rep" placeholder="[$&]" style="flex:1">
  </div>
  <div class="hl" id="rprev" style="min-height:20px;color:#188a54"></div>
  <div class="cheats">速查(点击填入):
    <code data-p="\d+">数字</code>
    <code data-p="1[3-9]\d{9}">手机号</code>
    <code data-p="[\w.+-]+@[\w-]+\.[\w.]+">邮箱</code>
    <code data-p="https?://[^\s]+">URL</code>
    <code data-p="\d{17}[\dXx]">身份证</code>
    <code data-p="[\u4e00-\u9fa5]+">中文</code>
  </div>
</div>
<script>
var $=function(id){return document.getElementById(id)};
function esc(s){return s.replace(/[&<>]/g,function(m){return{'&':'&amp;','<':'&lt;','>':'&gt;'}[m]})}
function flags(){
  var f='';if($('fg').checked)f+='g';if($('fi').checked)f+='i';
  if($('fm').checked)f+='m';if($('fs').checked)f+='s';if($('fu').checked)f+='u';return f;
}
function run(){
  var p=$('pat').value,txt=$('txt').value,err=$('err'),ms=[],m,re;
  $('list').innerHTML='';$('rprev').textContent='';
  if(!p){err.textContent='';$('hl').textContent=txt;return}
  try{re=new RegExp(p,flags())}catch(e){err.textContent='正则有误:'+e.message;$('hl').textContent=txt;return}
  err.textContent='';
  while((m=re.exec(txt))){ms.push(m);if(!m[0])re.lastIndex++;if(ms.length>2000)break}
  var html='',last=0;
  ms.forEach(function(m){
    html+=esc(txt.slice(last,m.index))+'<mark>'+esc(m[0]||'∅')+'</mark>';
    last=m.index+m[0].length;
  });
  $('hl').innerHTML=html+esc(txt.slice(last));
  var lis='';
  ms.slice(0,50).forEach(function(m,i){
    lis+='<li>#'+(i+1)+' ['+m.index+'] '+esc(m[0]);
    for(var g=1;g<m.length;g++)lis+=' · $'+g+'='+esc(m[g]===undefined?'—':m[g]);
    lis+='</li>';
  });
  $('list').innerHTML=lis?lis.slice(0,-4)+'':'<li style="color:#98a2b8">无匹配</li>';
  if(ms.length)try{$('rprev').textContent='替换预览: '+txt.replace(new RegExp(p,flags()),$('rep').value)}catch(e){}
}
['pat','txt','rep'].forEach(function(id){$(id).addEventListener('input',run)});
['fg','fi','fm','fs','fu'].forEach(function(id){$(id).addEventListener('change',run)});
document.querySelectorAll('.cheats code').forEach(function(c){
  c.onclick=function(){$('pat').value=c.getAttribute('data-p');run()};
});
run();
</script>
</body>
</html>
