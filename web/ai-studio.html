<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 工作台 · Nova Nebula Tools</title>
<meta name="description" content="从一句话想法到测试落地的 AI 全流程工作台：头脑风暴、需求评估、需求分析、方案设计、功能拆解、代码实现、测试落地。">
<link rel="stylesheet" href="/assets/css/tokens.css">
<style>
.nb-header { position: sticky; top: 0; z-index: 100; display: flex; align-items: center; gap: 18px;
  padding: 12px 24px; background: rgba(255,249,242,.92); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
.nb-logo { font: 800 19px/1 var(--font-sans); color: var(--text-main); text-decoration: none; display: flex; align-items: center; gap: 8px; }
.nb-logo i { width: 26px; height: 26px; border-radius: 8px; background: var(--ai-gradient); display: inline-block; }
.nb-nav { display: flex; gap: 4px; }
.nb-nav a { padding: 8px 14px; border-radius: var(--radius-btn); text-decoration: none; font: 600 14px/1 var(--font-sans); color: var(--text-sub); }
.nb-nav a:hover { background: var(--bg-warm-1); color: var(--text-main); }
.nb-nav a[aria-current="page"] { color: var(--ai-deep); background: var(--ai-soft); }
.nb-header .nb-user { margin-left: auto; display: flex; gap: 8px; align-items: center; }
.nb-user-chip { font: 600 13px/1 var(--font-sans); color: var(--text-main); background: var(--bg-warm-1); padding: 8px 12px; border-radius: 999px; }

.nb-layout { display: grid; grid-template-columns: 220px 1fr 260px; gap: 16px; max-width: 1280px; margin: 20px auto; padding: 0 16px; }
.nb-layout > aside, .nb-layout > main { min-width: 0; }
@media (max-width: 1080px) { .nb-layout { grid-template-columns: 200px 1fr; } #outSidebar { grid-column: 1 / -1; } }
@media (max-width: 760px) { .nb-layout { grid-template-columns: 1fr; } .nb-stepper { flex-direction: row; flex-wrap: wrap; } .nb-stepper button { width: auto; } }

.stage-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.stage-head h2 { margin: 0; font-size: 18px; flex: 1; }
.stage-body { margin-top: 14px; min-height: 300px; }
.nb-md { font-size: 15px; }
.nb-empty { text-align: center; padding: 60px 20px; color: var(--text-sub); }
.nb-empty .big { font-size: 40px; }

.chat-log { margin: 14px 0; max-height: 220px; overflow: auto; display: flex; flex-direction: column; gap: 8px; }
.chat-msg { padding: 8px 12px; border-radius: 12px; font-size: 14px; max-width: 92%; }
.chat-msg--u { align-self: flex-end; background: var(--bg-warm-2); }
.chat-msg--a { align-self: flex-start; background: var(--ai-soft); }
.chat-row { display: flex; gap: 8px; }
.chat-row .nb-input { flex: 1; }

.statusbar { position: sticky; bottom: 0; display: flex; gap: 18px; align-items: center;
  background: rgba(255,249,242,.95); border-top: 1px solid var(--line); padding: 8px 24px;
  font: 600 12px/1 var(--font-mono); color: var(--text-sub); }
.statusbar .meter-wrap { flex: 1; max-width: 240px; display: flex; align-items: center; gap: 8px; }
.edit-area { width: 100%; min-height: 320px; font: 400 14px/1.7 var(--font-mono); }
.out-item { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; background: transparent; border: 0; padding: 9px 10px; border-radius: 10px; cursor: pointer; font: 500 13px/1.3 var(--font-sans); color: var(--text-sub); }
.out-item:hover { background: var(--bg-warm-1); color: var(--text-main); }
.out-item .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); flex: none; }
.hint-ai { font: 500 12px/1.5 var(--font-sans); color: var(--text-sub); }
</style>
</head>
<body class="nb-skin">

<header class="nb-header">
  <a class="nb-logo" href="/"><i aria-hidden="true"></i>Nova Tools</a>
  <nav class="nb-nav" aria-label="主导航">
    <a href="/">首页</a>
    <a href="/ai-studio.html" aria-current="page">AI 工作台 <span class="nb-badge-ai">AI</span></a>
    <a href="/ai-chat.html">AI 对话</a>
  </nav>
  <div class="nb-user" id="userChip"></div>
</header>

<div class="nb-layout">
  <aside aria-label="流程阶段">
    <div class="nb-card nb-card--ai">
      <ul class="nb-stepper" id="stepper"></ul>
    </div>
    <p class="hint-ai" style="padding:10px 4px">每阶段可重新生成、编辑内容后继续，追问会带着当前阶段上下文。</p>
  </aside>

  <main>
    <div class="nb-card nb-card--ai" id="workCard">
      <div id="phaseIdea">
        <div class="stage-head"><h2>用一句话描述你的想法 ✨</h2></div>
        <label class="hint-ai" for="ideaInput">例如：做一个记录我家猫体重的提醒小工具</label>
        <textarea class="nb-textarea" id="ideaInput" rows="4" placeholder="用一句话描述你的想法…"></textarea>
        <div style="display:flex;gap:12px;margin-top:14px;flex-wrap:wrap;align-items:center">
          <label style="font:500 13px/1 var(--font-sans);color:var(--text-sub)">
            <input type="radio" name="mode" value="full" checked> 全流程一键跑
          </label>
          <label style="font:500 13px/1 var(--font-sans);color:var(--text-sub)">
            <input type="radio" name="mode" value="single"> 单阶段逐步跑
          </label>
          <span style="flex:1"></span>
          <button class="nb-btn nb-btn--ai" id="btnStart">开始全流程 →</button>
        </div>
        <div class="nb-empty" id="loginGate" hidden>
          <div class="big">[需登录]</div>
          <p>AI 全流程需要登录后使用（免费工具无需登录）。</p>
          <a class="nb-btn nb-btn--warm" href="/login.html">去登录</a>
        </div>
      </div>

      <div id="phaseStage" hidden>
        <div class="stage-head">
          <h2 id="stageTitle">阶段</h2>
          <button class="nb-btn nb-btn--ghost nb-btn--sm" id="btnRegen" title="重新生成本阶段">↻ 重新生成</button>
          <button class="nb-btn nb-btn--ghost nb-btn--sm" id="btnEdit">✎ 编辑</button>
          <button class="nb-btn nb-btn--ai nb-btn--sm" id="btnNext">下一阶段 →</button>
        </div>
        <div class="stage-body nb-md" id="stageContent" aria-live="polite"></div>
        <textarea class="edit-area nb-textarea" id="editArea" hidden></textarea>
        <div style="display:flex;gap:8px;margin-top:10px" id="editActions" hidden>
          <button class="nb-btn nb-btn--warm nb-btn--sm" id="btnSave">保存修改</button>
          <button class="nb-btn nb-btn--ghost nb-btn--sm" id="btnCancel">取消</button>
        </div>
        <div id="chatZone" style="margin-top:18px;border-top:1px dashed var(--line);padding-top:14px">
          <div class="hint-ai">对当前阶段继续追问（AI 会结合本阶段内容作答）：</div>
          <div class="chat-log" id="chatLog" aria-live="polite"></div>
          <div class="chat-row">
            <input class="nb-input" id="chatInput" placeholder="例如：再补充两个创新角度…" aria-label="追问输入">
            <button class="nb-btn nb-btn--ai" id="btnChat">发送</button>
          </div>
        </div>
      </div>
    </div>
  </main>

  <aside id="outSidebar" aria-label="产出汇总">
    <div class="nb-card">
      <h3 style="margin:0 0 8px;font-size:15px">产出汇总</h3>
      <div id="outList"></div>
      <div style="display:flex;flex-direction:column;gap:8px;margin-top:14px">
        <button class="nb-btn nb-btn--ai" id="btnExportZip" disabled>导出全部（zip）</button>
        <button class="nb-btn nb-btn--ghost nb-btn--sm" id="btnExportMd" disabled>导出文档（md）</button>
        <button class="nb-btn nb-btn--ghost nb-btn--sm" id="btnNewFlow">＋ 新建流程</button>
      </div>
    </div>
  </aside>
</div>

<div class="statusbar">
  <span id="stModel">model: –</span>
  <span id="stStage">stage: –</span>
  <span class="meter-wrap"><span>tokens</span><span class="nb-meter" style="flex:1"><i id="stMeter" style="width:0%"></i></span><span id="stTokens">0</span></span>
  <span id="stTime"></span>
</div>

<script src="/assets/js/core.js"></script>
<script src="/assets/js/ai-studio.js"></script>
<script>
(function(){
  function tok(){
    try{
      for(var i=0;i<localStorage.length;i++){
        var v=localStorage.getItem(localStorage.key(i))||'';
        var m=v.match(/eyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}/);
        if(m)return m[0];
      }
    }catch(e){}
    return '';
  }
  function hdrs(){
    var h={'Content-Type':'application/json'};
    var t=tok(); if(t)h['Authorization']='Bearer '+t;
    return h;
  }
  function box(){return document.getElementById('nbst-out');}
  function note(msg){
    var o=box(); if(!o)return;
    var d=document.createElement('div');
    d.style.cssText='padding:8px 10px;margin:6px 0;border-radius:8px;background:#fff7ed;color:#9a3412;font-size:13px';
    d.textContent=msg;o.appendChild(d);
  }
  function paywall(price,msg){
    if(typeof window.showPaywall==='function'){window.showPaywall(price,msg);return;}
    note(msg);
  }
  async function send(){
    var inp=document.getElementById('nbst-in');
    var q=(inp.value||'').trim(); if(!q)return;
    var o=box();
    var mine=document.createElement('div');
    mine.style.cssText='margin:8px 0;font-weight:600';
    mine.textContent='你: '+q; o.appendChild(mine);
    var ai=document.createElement('div');
    ai.style.cssText='margin:4px 0 12px;white-space:pre-wrap';
    o.appendChild(ai);
    inp.value='';
    try{
      var res=await fetch('/api/ai/chat',{method:'POST',headers:hdrs(),body:JSON.stringify({messages:[{role:'user',content:q}]})});
      if(!res.ok){
        var e=null; try{e=await res.json();}catch(_){}
        var m=(e&&e.message)||('请求失败 '+res.status);
        if(res.status===402){paywall(e&&e.price,m);}else{note(m);}
        return;
      }
      var rd=res.body.getReader(),dec=new TextDecoder(),buf='';
      while(true){
        var r=await rd.read(); if(r.done)break;
        buf+=dec.decode(r,{stream:true});
        var ls=buf.split('\n'); buf=ls.pop();
        for(var i=0;i<ls.length;i++){
          var L=ls[i];
          if(L.indexOf('data:')!==0)continue;
          var p=L.slice(5).trim();
          if(p==='[DONE]')continue;
          try{
            var j=JSON.parse(p);
            var d=j.choices&&j.choices[0]&&j.choices[0].delta&&j.choices[0].delta.content;
            if(d)ai.textContent+=d;
          }catch(_){}
        }
      }
    }catch(err){note('网络异常: '+err);}
  }
  async function flowRun(){
    var t=document.getElementById('nbst-ft').value||'工作台流程';
    var p1=document.getElementById('nbst-f1').value;
    var p2=document.getElementById('nbst-f2').value;
    if(!p1){note('请填至少第1步提示词');return;}
    var steps=[{name:'步骤1',prompt:p1}];
    if(p2)steps.push({name:'步骤2',prompt:p2});
    var res=await fetch('/api/ai/flow/start',{method:'POST',headers:hdrs(),body:JSON.stringify({title:t,steps:steps})});
    if(!res.ok){note('创建失败 '+res.status);return;}
    var f=await res.json();
    var o=box();
    var line=document.createElement('div');
    line.style.cssText='margin:8px 0;padding:8px;border-left:3px solid #7c3aed;white-space:pre-wrap';
    line.textContent='流程['+f.title+'] 运行中...'; o.appendChild(line);
    var res2=await fetch('/api/ai/flow/run',{method:'POST',headers:hdrs(),body:JSON.stringify({id:f.id})});
    if(!res2.ok){
      var e=null; try{e=await res2.json();}catch(_){}
      var m=(e&&e.message)||('运行失败 '+res2.status);
      if(res2.status===402){paywall(e&&e.price,m);}else{note(m);}
      return;
    }
    var f2=await res2.json();
    var txt='';
    (f2.steps||[]).forEach(function(s){
      txt+='['+s.name+'] '+s.status+'\n'+(s.output||'')+'\n\n';
    });
    line.textContent='流程['+f2.title+'] '+f2.state+'\n'+txt;
  }
  function ui(){
    if(document.getElementById('nbst-out'))return;
    var w=document.createElement('div');
    w.style.cssText='max-width:860px;margin:16px auto;padding:16px;background:#fff;border:1px solid #eee;border-radius:12px';
    w.innerHTML='<h3 style="margin:0 0 8px">AI 工作台</h3>'
      +'<textarea id="nbst-in" rows="2" placeholder="问点什么..." style="width:100%;padding:8px;border:1px solid #ddd;border-radius:8px"></textarea>'
      +'<button id="nbst-go" style="margin:8px 0;padding:8px 18px;background:#7c3aed;color:#fff;border:0;border-radius:8px;cursor:pointer">发送(流式)</button>'
      +'<div style="margin:14px 0 6px;font-weight:600">流程模式(两步串行)</div>'
      +'<input id="nbst-ft" placeholder="流程标题" style="width:100%;padding:6px 8px;border:1px solid #ddd;border-radius:8px">'
      +'<input id="nbst-f1" placeholder="第1步提示词" style="width:100%;margin-top:6px;padding:6px 8px;border:1px solid #ddd;border-radius:8px">'
      +'<input id="nbst-f2" placeholder="第2步提示词(可选)" style="width:100%;margin-top:6px;padding:6px 8px;border:1px solid #ddd;border-radius:8px">'
      +'<button id="nbst-fr" style="margin:8px 0;padding:8px 18px;background:#2563eb;color:#fff;border:0;border-radius:8px;cursor:pointer">创建并跑完</button>'
      +'<div id="nbst-out" style="margin-top:8px;font-size:14px"></div>';
    document.body.appendChild(w);
    document.getElementById('nbst-go').onclick=send;
    document.getElementById('nbst-fr').onclick=flowRun;
  }
  if(document.readyState==='loading'){
    document.addEventListener('DOMContentLoaded',ui);
  }else{ui();}
})();
</script>

</body>
</html>
